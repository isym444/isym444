name: Update stats

on:
  schedule:
    - cron: "15 6 * * *" # after the API's daily syncs (Anki, CLIST, CSES, advice)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stats/requirements.txt

      - run: pip install -r stats/requirements.txt

      - name: Refresh README stats and charts
        env:
          STUDY_API_URL: ${{ vars.STUDY_API_URL }}
          STUDY_API_TOKEN: ${{ secrets.STUDY_API_TOKEN }}
        run: python stats/update_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update stats"
            git push
          fi
